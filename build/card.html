<!doctype html><html><head><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
.w{position:absolute;left:0;width:1920px;top:150px;text-align:center;color:#fff6e4;text-shadow:0 4px 30px rgba(20,10,60,.6)}
.logo{font:700 112px 'Fraunces',serif;letter-spacing:.02em}.logo span{display:inline-block;width:34px;height:34px;border-radius:50%;background:#ffc760;box-shadow:0 0 40px 14px rgba(255,190,90,.75);margin-right:30px;vertical-align:middle;position:relative;top:-14px}
.sub{font:600 30px 'Nunito',sans-serif;letter-spacing:.42em;margin-top:6px;opacity:.9}
.line{font:500 50px 'Fraunces',serif;margin-top:46px}
.tag{font:500 38px 'Nunito',sans-serif;margin-top:22px;opacity:.95}
.fine{position:absolute;right:40px;bottom:28px;font:500 20px 'Nunito',sans-serif;color:rgba(255,246,228,.7)}
.h{visibility:hidden}</style></head><body><div class="w">
<div class="logo"><span></span>Porchlight</div><div class="sub">MOBILE</div>
<div class="line" id="l1">Coverage that reaches the end of the road.</div>
<div class="tag" id="l2">You can still walk up the hill. You just don't have to.</div></div>
<div class="fine" id="f">Spec ad. Porchlight Mobile is a fictional brand.</div>
<script>const s=+location.hash.slice(1)||1; if(s<2){l1.className+=' h';} if(s<3){l2.className+=' h';f.className+=' h'}</script></body></html>
